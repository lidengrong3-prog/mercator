<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSS测试</title>
<style>
body { background: #f0f2f5; font-family: sans-serif; padding: 40px; }
.test-card { background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto; }
.test-card h1 { color: #2d5a8e; margin-bottom: 10px; }
.test-card p { color: #6b7280; }
.test-btn { background: #2d5a8e; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="test-card">
  <h1>JAY观海 CSS测试</h1>
  <p>如果你能看到蓝色标题、白色卡片和圆角按钮，说明CSS正常渲染。</p>
  <button class="test-btn">测试按钮</button>
</div>
</body>
</html>
