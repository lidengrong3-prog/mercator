<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root{
  --primary:#2d5a8e;
  --card:#ffffff;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --radius:12px;
}
body{background:#f0f2f5;font-family:system-ui,sans-serif;padding:20px}
h1{color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
</style>
</head>
<body>
<h1>如果CSS变量正常，标题应该是蓝色</h1>
<div class="card">
<h2>卡片标题</h2>
<p>白色卡片带圆角阴影</p>
</div>
</body>
</html>
