name: Notification delivery retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-delivery-worker
  cancel-in-progress: false

jobs:
  process-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      NOTIFICATION_CHANNELS_ENABLED: ${{ vars.NOTIFICATION_CHANNELS_ENABLED || secrets.NOTIFICATION_CHANNELS_ENABLED || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.NOTIFICATION_CHANNELS_ENABLED == 'true'
      - uses: actions/setup-python@v5
        if: env.NOTIFICATION_CHANNELS_ENABLED == 'true'
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        if: env.NOTIFICATION_CHANNELS_ENABLED == 'true'
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Process retryable notification deliveries
        shell: bash
        run: |
          set -eu
          case "$NOTIFICATION_CHANNELS_ENABLED" in
            false)
              echo "External notification delivery is disabled."
              exit 0
              ;;
            true) ;;
            *) echo "NOTIFICATION_CHANNELS_ENABLED must be true or false" >&2; exit 1 ;;
          esac
          test -n "$SUPABASE_URL" || { echo "Missing production secret: SUPABASE_URL" >&2; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY" || { echo "Missing production secret: SUPABASE_SERVICE_KEY" >&2; exit 1; }
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail-with-body --silent --show-error --retry 2 --max-time 180 \
            "$SUPABASE_URL/functions/v1/notification-dispatch" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"action":"process_pending","limit":25}' \
            > "$response_file"
          python - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("status") != "processed":
              raise SystemExit("notification worker returned an invalid response")
          failed = [item for item in result.get("results", []) if item.get("status") == "failed"]
          print(f"events_created={result.get('events_created', 0)} claimed={result.get('claimed', 0)} failed={len(failed)}")
          PY
