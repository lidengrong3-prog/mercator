name: Collection Worker Failover Drill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercator-collection-worker-failover-drill
  cancel-in-progress: false

jobs:
  verify-legacy-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      COLLECTION_WORKER_CUTOVER: 'true'
      COLLECTION_WORKER_PILOT_ONLY: 'false'
      EVENT_NAME: schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Read Worker health after the operator stops heartbeats
        shell: bash
        run: |
          set -eu
          python scripts/collection_worker.py --health-check > collection-worker-health.json
          python scripts/route_collection_schedule.py \
            --health-file collection-worker-health.json \
            --event-name "$EVENT_NAME" \
            --cutover "$COLLECTION_WORKER_CUTOVER" \
            --pilot-only "$COLLECTION_WORKER_PILOT_ONLY" \
            --output collection-routing-decision.json
          test "$(python -c 'import json; print(json.load(open("collection-routing-decision.json", encoding="utf-8"))["mode"])')" = legacy
          test "$(python -c 'import json; print(json.load(open("collection-routing-decision.json", encoding="utf-8"))["worker_ready"])')" = False
      - name: Publish failover evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-worker-failover-drill-${{ github.run_id }}
          path: |
            collection-worker-health.json
            collection-routing-decision.json
          if-no-files-found: warn
          retention-days: 30
