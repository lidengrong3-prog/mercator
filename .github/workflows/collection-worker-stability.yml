name: Collection Worker Stability Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: read

jobs:
  seven-day-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      COLLECTION_WORKER_ID: ${{ vars.COLLECTION_WORKER_ID || 'mercator-render-primary' }}
      COLLECTION_WORKER_MAX_HEARTBEAT_GAP_SECONDS: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Verify seven-day Worker evidence before legacy removal
        run: python scripts/collection_worker_stability.py --window-hours 168 --output collection-worker-stability.json
      - name: Publish stability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-worker-stability-${{ github.run_id }}
          path: collection-worker-stability.json
          if-no-files-found: error
          retention-days: 90
