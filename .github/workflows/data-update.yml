name: Mercator Data Update

on:
  schedule:
    # 每4小时运行一次 (UTC 1:15, 5:15, 9:15, 13:15, 17:15, 21:15)
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- Step 1: Federal Register 政策采集 (原有) ----
      - name: Run global data collector (Federal Register)
        run: python scripts/collect_data.py

      # ---- Step 2: US Market 品类数据采集 (原有) ----
      - name: Collect US market intelligence (8 categories)
        run: python scripts/collect_us_market.py

      # ---- Step 3: CPSC 产品召回数据采集 (新增) ----
      - name: Collect CPSC product recalls (China-related)
        run: python scripts/collect_cpsc.py

      # ---- Step 4: 宏观经济数据采集 (新增) ----
      - name: Collect US macro indicators (FRED/BLS)
        run: python scripts/collect_us_macro.py --update-countries

      # ---- Step 5: 动态预警生成 (新增) ----
      - name: Generate dynamic alerts from collected data
        run: python scripts/generate_alerts.py

      # ---- Step 6: 发布前统一数据质量闸门 ----
      - name: Validate data quality before publishing
        run: python scripts/validate_data.py

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercator-data-quality-${{ github.run_id }}
          path: data/quality_report.json
          if-no-files-found: error
          retention-days: 30

      # ---- Step 7: Supabase 数据同步 ----
      - name: Sync data to Supabase
        run: python scripts/sync_to_supabase.py

      # ---- Step 8: 生成 PDF 报告 ----
      - name: Install report deps
        run: pip install --quiet reportlab pypdf

      - name: Generate US market reports (PDF)
        run: python scripts/gen_us_market_report.py

      # ---- Step 9: 提交已通过校验的数据与质量报告 ----
      - id: git-check
        run: git diff --quiet data/ reports/ || echo "changed=true" >> $GITHUB_OUTPUT

      - if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "Mercator Bot"
          git config user.email "mercator-bot@users.noreply.github.com"
          git add data/ reports/
          git commit -m "chore: auto-update data pipeline (policies + CPSC + macro + alerts) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
