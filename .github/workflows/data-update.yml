name: Mercator Collection Scheduler

on:
  schedule:
    # Keep the four-hour production schedule during Worker migration.
    - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      collector:
        description: Enqueue one collector, or all configured collectors
        type: choice
        required: true
        default: all
        options:
          - all
          - collect_data
          - collect_us_taxes
          - collect_us_access
          - collect_us_market
          - collect_cpsc
          - collect_us_macro
          - backfill_history
      run_id:
        description: Optional idempotency batch ID (leave empty for a generated ID)
        required: false
        type: string
      parameters_json:
        description: Optional allowlisted collector parameters as a JSON object
        required: false
        default: '{}'
        type: string

permissions:
  contents: read

concurrency:
  group: mercator-collection-scheduler
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      worker_ready: ${{ steps.route.outputs.worker_ready }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      COLLECTION_WORKER_CUTOVER: ${{ vars.COLLECTION_WORKER_CUTOVER || 'false' }}
      COLLECTION_WORKER_PILOT_ONLY: ${{ vars.COLLECTION_WORKER_PILOT_ONLY || 'false' }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Route scheduled collection without a coverage gap
        id: route
        shell: bash
        run: |
          set -u
          if ! python scripts/collection_worker.py --health-check > collection-worker-health.json; then
            printf '%s\n' '{"active_workers":0,"queued":null,"dead_letter":null,"health_error":true}' > collection-worker-health.json
          fi
          python scripts/route_collection_schedule.py \
            --health-file collection-worker-health.json \
            --event-name "$EVENT_NAME" \
            --cutover "$COLLECTION_WORKER_CUTOVER" \
            --pilot-only "$COLLECTION_WORKER_PILOT_ONLY" \
            --output collection-routing-decision.json
      - name: Publish routing health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-routing-health-${{ github.run_id }}
          path: collection-worker-health.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish routing decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-routing-decision-${{ github.run_id }}
          path: collection-routing-decision.json
          if-no-files-found: warn
          retention-days: 30

  enqueue:
    needs: route
    if: ${{ needs.route.outputs.mode == 'worker' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SELECTED_COLLECTOR: ${{ inputs.collector }}
      MANUAL_RUN_ID: ${{ inputs.run_id }}
      TASK_PARAMETERS_JSON: ${{ inputs.parameters_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Enqueue collection task
        shell: bash
        run: |
          set -eu
          selected="${SELECTED_COLLECTOR:-all}"
          parameters="${TASK_PARAMETERS_JSON:-}"
          if [ -z "$parameters" ]; then parameters='{}'; fi
          run_id="${MANUAL_RUN_ID:-}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            run_id="scheduled-$(date -u +%Y%m%dT%H)-4h"
          fi
          args=(--parameters-json "$parameters" --run-id "$run_id")
          if [ "$selected" != "all" ]; then args+=(--collector "$selected"); fi
          python scripts/enqueue_collection_tasks.py "${args[@]}"

  # Fail-safe migration path: keep this job while the Worker rollout is being
  # evaluated. If the Worker later disappears, the next scheduled run routes
  # here instead of silently leaving production data stale. Do not remove this
  # job until the seven-day stability gate has passed and an owner has reviewed
  # the evidence.
  legacy-update-data:
    needs: route
    if: ${{ needs.route.outputs.mode == 'legacy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: write
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      REGULATORY_TRANSLATION_API_URL: ${{ secrets.REGULATORY_TRANSLATION_API_URL || secrets.DEEPSEEK_API_URL || 'https://api.deepseek.com/chat/completions' }}
      REGULATORY_TRANSLATION_API_KEY: ${{ secrets.REGULATORY_TRANSLATION_API_KEY || secrets.DEEPSEEK_API_KEY }}
      REGULATORY_TRANSLATION_MODEL: ${{ secrets.REGULATORY_TRANSLATION_MODEL || secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}
      ENABLE_OPTIONAL_PLATFORM_RULES: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Validate regulatory translation configuration
        run: python scripts/translate_regulatory_data.py --check-config
      - name: Restore complete collector state from private Storage
        run: python scripts/bootstrap_worker_data.py --required
      - name: Run configured market data collector
        run: python scripts/collect_data.py
      - name: Collect official US tax and market-access records
        run: python scripts/collect_us_regulatory.py
      - name: Translate policy, tax and access records to Simplified Chinese
        run: python scripts/translate_regulatory_data.py --require-config
      - name: Collect configured market intelligence
        run: python scripts/collect_us_market.py
      - name: Collect CPSC product recalls
        run: python scripts/collect_cpsc.py
      - name: Collect macro indicators
        run: python scripts/collect_us_macro.py --update-countries
      - name: Generate dynamic alerts
        run: python scripts/generate_alerts.py
      - name: Validate data quality before publishing
        run: python scripts/validate_data.py
      - name: Sync data to Supabase
        run: python scripts/sync_to_supabase.py
      - name: Reduce collector outputs to public repository projections
        run: python scripts/prepare_public_repository_data.py
      - name: Enforce repository privacy boundary
        run: python scripts/repository_privacy_check.py
      - id: git-check
        shell: bash
        run: git diff --quiet -- data/ || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish fresh public projections
        if: steps.git-check.outputs.changed == 'true'
        shell: bash
        run: |
          set -eu
          git config user.name "Mercator Bot"
          git config user.email "mercator-bot@users.noreply.github.com"
          git add -- \
            data/access_requirements.json data/alerts.json data/countries.json \
            data/industry_advisories.json data/market_scope.json data/platforms.json \
            data/policies.json data/quality_report.json data/rules.json data/taxes.json \
            data/us_market/macro_indicators.json
          git commit -m "chore: refresh public data projections $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
