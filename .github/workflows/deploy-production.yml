name: Production release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Validate code, data contracts and report engine
        run: npm test
      - name: Reject stale or non-publishable data
        run: python scripts/validate_data.py
      - name: Validate Python syntax
        run: python -m compileall -q scripts tests data supabase
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile acceptance tests
        run: npm run test:browser

  deploy-backend:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      AI_REQUESTS_PER_MINUTE: ${{ secrets.AI_REQUESTS_PER_MINUTE }}
      AI_MONTHLY_TOKEN_LIMIT: ${{ secrets.AI_MONTHLY_TOKEN_LIMIT }}
      AI_INPUT_COST_PER_MILLION_USD: ${{ secrets.AI_INPUT_COST_PER_MILLION_USD }}
      AI_OUTPUT_COST_PER_MILLION_USD: ${{ secrets.AI_OUTPUT_COST_PER_MILLION_USD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required backend release secrets
        shell: bash
        run: |
          set -eu
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD DEEPSEEK_API_KEY DEEPSEEK_MODEL ALLOWED_ORIGINS; do
            test -n "${!name:-}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done
      - name: Link Supabase project
        run: npx --yes supabase@2.39.2 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations before functions
        run: npx --yes supabase@2.39.2 db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -eu
          args=(
            "DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com}"
            "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
            "DEEPSEEK_MODEL=$DEEPSEEK_MODEL"
            "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            "AI_REQUESTS_PER_MINUTE=${AI_REQUESTS_PER_MINUTE:-20}"
            "AI_MONTHLY_TOKEN_LIMIT=${AI_MONTHLY_TOKEN_LIMIT:-0}"
            "AI_INPUT_COST_PER_MILLION_USD=${AI_INPUT_COST_PER_MILLION_USD:-0}"
            "AI_OUTPUT_COST_PER_MILLION_USD=${AI_OUTPUT_COST_PER_MILLION_USD:-0}"
          )
          npx --yes supabase@2.39.2 secrets set --project-ref "$SUPABASE_PROJECT_ID" "${args[@]}"
      - name: Deploy JWT-protected Edge Functions
        shell: bash
        run: |
          set -eu
          for function_name in ai-proxy report-export report-docx billing-checkout admin-summary; do
            npx --yes supabase@2.39.2 functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
          done

  authenticated-acceptance:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      PROD_TEST_USER_B_EMAIL: ${{ secrets.PROD_TEST_USER_B_EMAIL }}
      PROD_TEST_USER_B_PASSWORD: ${{ secrets.PROD_TEST_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run two-account production report acceptance
        run: python scripts/production_acceptance.py

  deploy-frontend:
    needs: authenticated-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site after backend acceptance
        shell: bash
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/
          if [ -d reports ]; then cp -R reports _site/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Verify deployed frontend and Supabase API
        shell: bash
        run: |
          set -eu
          test -n "$PRODUCTION_SITE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 30 "$PRODUCTION_SITE_URL" | grep -q 'JAY观海'
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/market_data?select=id&limit=1" > /dev/null
