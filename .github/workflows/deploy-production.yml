name: Production release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify release ref, worktree and migration ordering
        run: python scripts/release_preflight.py
      - run: npm ci
      - name: Validate code, data contracts and report engine
        run: npm test
      - name: Validate Edge Functions
        run: |
          deno check supabase/functions/_shared/report-document.ts supabase/functions/_shared/report-pdf.ts supabase/functions/_shared/report-docx.ts supabase/functions/_shared/report-validation.ts supabase/functions/report-save/index.ts supabase/functions/report-export/index.ts supabase/functions/report-docx/index.ts supabase/functions/workspace-invite/index.ts
          deno check supabase/functions/ai-proxy/index.ts supabase/functions/billing-checkout/index.ts supabase/functions/billing-status/index.ts supabase/functions/billing-portal/index.ts supabase/functions/billing-webhook/index.ts
          deno test --allow-env supabase/functions/_shared/report-export.test.ts supabase/functions/_shared/report-quality.test.ts supabase/functions/_shared/report-validation.test.ts supabase/functions/workspace-invite/index.test.ts
      - name: Reject stale or non-publishable data
        run: python scripts/validate_data.py
      - name: Validate Python syntax
        run: python -m compileall -q scripts tests data supabase
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile acceptance tests
        run: npm run test:browser

  deploy-backend:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      APP_PUBLIC_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      RELEASE_SHA: ${{ github.sha }}
      AI_REQUESTS_PER_MINUTE: ${{ secrets.AI_REQUESTS_PER_MINUTE }}
      AI_MONTHLY_TOKEN_LIMIT: ${{ secrets.AI_MONTHLY_TOKEN_LIMIT }}
      AI_INPUT_COST_PER_MILLION_USD: ${{ secrets.AI_INPUT_COST_PER_MILLION_USD }}
      AI_OUTPUT_COST_PER_MILLION_USD: ${{ secrets.AI_OUTPUT_COST_PER_MILLION_USD }}
      BILLING_ENABLED: ${{ vars.BILLING_ENABLED || secrets.BILLING_ENABLED || 'false' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${{ secrets.STRIPE_WEBHOOK_TOLERANCE_SECONDS }}
      NOTIFICATION_CHANNELS_ENABLED: ${{ vars.NOTIFICATION_CHANNELS_ENABLED || secrets.NOTIFICATION_CHANNELS_ENABLED || 'false' }}
      NOTIFICATION_CONFIG_ENCRYPTION_KEY: ${{ secrets.NOTIFICATION_CONFIG_ENCRYPTION_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
      WORKSPACE_INVITE_FROM_EMAIL: ${{ secrets.WORKSPACE_INVITE_FROM_EMAIL || secrets.NOTIFICATION_FROM_EMAIL }}
      NOTIFICATION_ALERT_MAX_AGE_DAYS: ${{ vars.NOTIFICATION_ALERT_MAX_AGE_DAYS || secrets.NOTIFICATION_ALERT_MAX_AGE_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate required backend release secrets
        shell: bash
        run: |
          set -eu
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD SUPABASE_URL DEEPSEEK_API_KEY DEEPSEEK_MODEL ALLOWED_ORIGINS APP_PUBLIC_URL RESEND_API_KEY WORKSPACE_INVITE_FROM_EMAIL; do
            test -n "${!name:-}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done
          [[ "$APP_PUBLIC_URL" == https://* ]] || { echo "APP_PUBLIC_URL must use https" >&2; exit 1; }
          [[ "$WORKSPACE_INVITE_FROM_EMAIL" == *@* ]] || { echo "WORKSPACE_INVITE_FROM_EMAIL must be a valid Resend sender" >&2; exit 1; }
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Validate formal production origin
        run: python scripts/release_preflight.py --origin-only
      - name: Validate optional production billing configuration
        shell: bash
        run: |
          set -eu
          case "$BILLING_ENABLED" in
            true)
              for name in STRIPE_SECRET_KEY STRIPE_PRICE_PRO_MONTHLY STRIPE_WEBHOOK_SECRET; do
                test -n "${!name:-}" || { echo "Billing is enabled but $name is missing" >&2; exit 1; }
              done
              [[ "$STRIPE_SECRET_KEY" == sk_live_* ]] || { echo "Production billing requires a Stripe live secret key" >&2; exit 1; }
              [[ "$STRIPE_PRICE_PRO_MONTHLY" == price_* ]] || { echo "Invalid Stripe price ID" >&2; exit 1; }
              [[ "$STRIPE_WEBHOOK_SECRET" == whsec_* ]] || { echo "Invalid Stripe webhook signing secret" >&2; exit 1; }
              ;;
            false) ;;
            *) echo "BILLING_ENABLED must be true or false" >&2; exit 1 ;;
          esac
      - name: Validate optional external notification configuration
        shell: bash
        run: |
          set -eu
          case "$NOTIFICATION_CHANNELS_ENABLED" in
            true)
              for name in NOTIFICATION_CONFIG_ENCRYPTION_KEY RESEND_API_KEY NOTIFICATION_FROM_EMAIL; do
                test -n "${!name:-}" || { echo "External notifications are enabled but $name is missing" >&2; exit 1; }
              done
              test "${#NOTIFICATION_CONFIG_ENCRYPTION_KEY}" -ge 24 || { echo "NOTIFICATION_CONFIG_ENCRYPTION_KEY must contain at least 24 characters" >&2; exit 1; }
              [[ "$NOTIFICATION_FROM_EMAIL" == *@* ]] || { echo "NOTIFICATION_FROM_EMAIL must be a valid Resend sender" >&2; exit 1; }
              [[ "$NOTIFICATION_ALERT_MAX_AGE_DAYS" =~ ^[0-9]+$ ]] && [ "$NOTIFICATION_ALERT_MAX_AGE_DAYS" -ge 1 ] && [ "$NOTIFICATION_ALERT_MAX_AGE_DAYS" -le 30 ] || { echo "NOTIFICATION_ALERT_MAX_AGE_DAYS must be between 1 and 30" >&2; exit 1; }
              ;;
            false) ;;
            *) echo "NOTIFICATION_CHANNELS_ENABLED must be true or false" >&2; exit 1 ;;
          esac
      - name: Resolve release migration head
        shell: bash
        run: |
          set -eu
          migration_head="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/\.sql$//')"
          test -n "$migration_head"
          echo "MIGRATION_HEAD=$migration_head" >> "$GITHUB_ENV"
      - name: Link Supabase project
        run: npx --yes supabase@2.39.2 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --dns-resolver https
      - name: Apply database migrations before functions
        run: npx --yes supabase@2.39.2 db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dns-resolver https
      - name: Verify remote migration head
        shell: bash
        run: |
          set -eu
          migration_version="${MIGRATION_HEAD%%_*}"
          npx --yes supabase@2.39.2 migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https | tee migration-list.txt
          awk -v version="$migration_version" '
            $1 == version && $2 == "|" && $3 == version { matched = 1 }
            END { exit matched ? 0 : 1 }
          ' migration-list.txt
      - name: Sync validated market data and provenance
        run: python scripts/sync_to_supabase.py
      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -eu
          args=(
            "DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com}"
            "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
            "DEEPSEEK_MODEL=$DEEPSEEK_MODEL"
            "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            "RELEASE_SHA=$RELEASE_SHA"
            "RELEASE_MIGRATION_HEAD=$MIGRATION_HEAD"
            "AI_REQUESTS_PER_MINUTE=${AI_REQUESTS_PER_MINUTE:-20}"
            "AI_MONTHLY_TOKEN_LIMIT=${AI_MONTHLY_TOKEN_LIMIT:-0}"
            "AI_INPUT_COST_PER_MILLION_USD=${AI_INPUT_COST_PER_MILLION_USD:-0}"
            "AI_OUTPUT_COST_PER_MILLION_USD=${AI_OUTPUT_COST_PER_MILLION_USD:-0}"
            "BILLING_ENABLED=$BILLING_ENABLED"
            "STRIPE_ALLOW_TEST_EVENTS=false"
            "PRODUCTION_SITE_URL=$PRODUCTION_SITE_URL"
            "APP_PUBLIC_URL=$APP_PUBLIC_URL"
            "RESEND_API_KEY=$RESEND_API_KEY"
            "WORKSPACE_INVITE_FROM_EMAIL=$WORKSPACE_INVITE_FROM_EMAIL"
            "NOTIFICATION_CHANNELS_ENABLED=$NOTIFICATION_CHANNELS_ENABLED"
            "NOTIFICATION_ALERT_MAX_AGE_DAYS=$NOTIFICATION_ALERT_MAX_AGE_DAYS"
          )
          if [ "$BILLING_ENABLED" = true ]; then
            args+=(
              "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
              "STRIPE_PRICE_PRO_MONTHLY=$STRIPE_PRICE_PRO_MONTHLY"
              "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
              "STRIPE_WEBHOOK_TOLERANCE_SECONDS=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}"
            )
          fi
          if [ "$NOTIFICATION_CHANNELS_ENABLED" = true ]; then
            args+=(
              "NOTIFICATION_CONFIG_ENCRYPTION_KEY=$NOTIFICATION_CONFIG_ENCRYPTION_KEY"
              "NOTIFICATION_FROM_EMAIL=$NOTIFICATION_FROM_EMAIL"
            )
          fi
          npx --yes supabase@2.39.2 secrets set --project-ref "$SUPABASE_PROJECT_ID" "${args[@]}"
      - name: Deploy JWT-protected Edge Functions
        shell: bash
        run: |
          set -eu
          for function_name in ai-proxy report-save report-export report-docx workspace-invite billing-checkout billing-status billing-portal admin-summary; do
            npx --yes supabase@2.39.2 functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
          done
      - name: Deploy Stripe webhook without Supabase JWT verification
        run: npx --yes supabase@2.39.2 functions deploy billing-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Deploy notification dispatcher with application-level authentication
        run: npx --yes supabase@2.39.2 functions deploy notification-dispatch --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

  authenticated-acceptance:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      PROD_TEST_USER_B_EMAIL: ${{ secrets.PROD_TEST_USER_B_EMAIL }}
      PROD_TEST_USER_B_PASSWORD: ${{ secrets.PROD_TEST_USER_B_PASSWORD }}
      PRODUCTION_ACCEPTANCE_OUTPUT: production-acceptance-result.json
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Run two-account production report acceptance
        run: python scripts/production_acceptance.py
      - name: Publish backend acceptance result
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-result-${{ github.run_id }}
          path: production-acceptance-result.json
          if-no-files-found: error

  deploy-frontend:
    needs: authenticated-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/configure-pages@v5
      - name: Assemble static site after backend acceptance
        run: python scripts/build_public_site.py --output _site
      - name: Write release manifest
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          migration_head="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/\.sql$//')"
          test -n "$migration_head"
          production_origin="$(python -c 'from urllib.parse import urlparse; import os; parsed=urlparse(os.environ["PRODUCTION_SITE_URL"]); print(f"{parsed.scheme}://{parsed.netloc}")')"
          python - "$migration_head" "$production_origin" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          Path('_site/release.json').write_text(json.dumps({
              'release_sha': os.environ['GITHUB_SHA'],
              'migration_head': sys.argv[1],
              'production_origin': sys.argv[2],
              'frontend': 'github-pages',
              'source_ref': os.environ.get('GITHUB_REF_NAME', ''),
              'generated_at': datetime.now(timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-authenticated-acceptance:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      PROD_TEST_USER_B_EMAIL: ${{ secrets.PROD_TEST_USER_B_EMAIL }}
      PROD_TEST_USER_B_PASSWORD: ${{ secrets.PROD_TEST_USER_B_PASSWORD }}
      RUN_PRODUCTION_ACCEPTANCE: '1'
      PRODUCTION_BROWSER_ACCEPTANCE_OUTPUT: production-browser-acceptance-result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run real browser exception and account-isolation acceptance
        run: JAY_PLAYWRIGHT_BASE_URL="$PRODUCTION_SITE_URL" npm run test:browser:production
      - name: Publish browser exception acceptance result
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-acceptance-result-${{ github.run_id }}
          path: production-browser-acceptance-result.json
          if-no-files-found: error
      - name: Upload browser acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-diagnostics-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  production-smoke:
    needs: browser-authenticated-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://lidengrong3-prog.github.io/mercator/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      ACCEPTANCE_RESULT_FILE: production-acceptance-result.json
      BROWSER_ACCEPTANCE_RESULT_FILE: production-browser-acceptance-result.json
      NOTIFICATION_CHANNELS_ENABLED: ${{ vars.NOTIFICATION_CHANNELS_ENABLED || secrets.NOTIFICATION_CHANNELS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download backend acceptance result
        uses: actions/download-artifact@v4
        with:
          name: production-acceptance-result-${{ github.run_id }}
      - name: Download browser exception acceptance result
        uses: actions/download-artifact@v4
        with:
          name: production-browser-acceptance-result-${{ github.run_id }}
      - name: Resolve expected migration head
        shell: bash
        run: |
          set -eu
          migration_head="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/\.sql$//')"
          test -n "$migration_head"
          echo "EXPECTED_MIGRATION_HEAD=$migration_head" >> "$GITHUB_ENV"
      - name: Verify deployed frontend, database, Storage and functions
        shell: bash
        run: python scripts/production_release_check.py
