name: Production release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify release ref, worktree and migration ordering
        run: python scripts/release_preflight.py
      - name: Reject tracked secrets and restricted data
        run: python scripts/repository_privacy_check.py
      - run: npm ci
      - name: Validate code, data contracts and report engine
        run: npm test
      - name: Validate Edge Functions
        run: |
          deno check supabase/functions/_shared/report-document.ts supabase/functions/_shared/report-pdf.ts supabase/functions/_shared/report-docx.ts supabase/functions/_shared/report-validation.ts supabase/functions/_shared/security.ts supabase/functions/_shared/ai-gateway.ts supabase/functions/_shared/coze-chat.ts supabase/functions/report-save/index.ts supabase/functions/report-export/index.ts supabase/functions/report-docx/index.ts supabase/functions/workspace-invite/index.ts supabase/functions/data-subject-request/index.ts supabase/functions/security-gate/index.ts supabase/functions/history-search/index.ts supabase/functions/resource-library/index.ts supabase/functions/notification-dispatch/index.ts
          deno check supabase/functions/ai-proxy/index.ts supabase/functions/billing-checkout/index.ts supabase/functions/billing-status/index.ts supabase/functions/billing-portal/index.ts supabase/functions/billing-webhook/index.ts
          deno test --allow-env supabase/functions/_shared/report-export.test.ts supabase/functions/_shared/report-quality.test.ts supabase/functions/_shared/report-validation.test.ts supabase/functions/_shared/ai-gateway.test.ts supabase/functions/_shared/coze-chat.test.ts supabase/functions/workspace-invite/index.test.ts
      - name: Reject stale or non-publishable data
        run: python scripts/validate_data.py --public-projection
      - name: Validate Python syntax
        run: python -m compileall -q scripts tests data supabase
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile acceptance tests
        run: npm run test:browser

  migration-backup:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      MIGRATION_BACKUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pre-migration backup configuration
        shell: bash
        run: |
          set -eu
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            test -n "${!name:-}" || { echo "Missing production backup secret: $name" >&2; exit 1; }
          done
      - name: Resolve service key for private backup registration
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Install matching PostgreSQL client
        run: bash scripts/install_postgresql_client.sh SUPABASE_DB_URL
      - name: Create and verify pre-migration backup
        run: python scripts/create_migration_backup.py --requested-migrations 25 --output migration-backup-result.json
      - name: Publish sanitized migration backup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-backup-${{ github.run_id }}
          path: migration-backup-result.json
          if-no-files-found: error
          retention-days: 30

  deploy-backend:
    needs:
      - quality-gate
      - migration-backup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      COZE_API_URL: ${{ vars.COZE_API_URL || secrets.COZE_API_URL || 'https://api.coze.cn' }}
      COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
      COZE_API_KEY: ${{ secrets.COZE_API_KEY }}
      COZE_BOT_ID: ${{ secrets.COZE_BOT_ID }}
      COZE_BOT_ID_MARKET_QA: ${{ secrets.COZE_BOT_ID_MARKET_QA }}
      COZE_BOT_ID_REPORT: ${{ secrets.COZE_BOT_ID_REPORT }}
      COZE_BOT_ID_COURSE: ${{ secrets.COZE_BOT_ID_COURSE }}
      COZE_MODEL: ${{ secrets.COZE_MODEL }}
      COZE_POLL_INTERVAL_MS: ${{ vars.COZE_POLL_INTERVAL_MS || secrets.COZE_POLL_INTERVAL_MS || '500' }}
      COZE_POLL_MAX_ATTEMPTS: ${{ vars.COZE_POLL_MAX_ATTEMPTS || secrets.COZE_POLL_MAX_ATTEMPTS || '60' }}
      DOUBAO_API_URL: ${{ secrets.DOUBAO_API_URL }}
      DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
      ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
      ARK_MODEL: ${{ secrets.ARK_MODEL }}
      DOUBAO_MODEL: ${{ secrets.DOUBAO_MODEL }}
      OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_ENABLE_WEB_SEARCH: ${{ vars.OPENAI_ENABLE_WEB_SEARCH || secrets.OPENAI_ENABLE_WEB_SEARCH || 'false' }}
      CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
      AI_FALLBACK_PROVIDERS: ${{ vars.AI_FALLBACK_PROVIDERS || secrets.AI_FALLBACK_PROVIDERS || '' }}
      AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER: ${{ vars.AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER || secrets.AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER || 'deepseek' }}
      AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER: ${{ vars.AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER || secrets.AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER || 'coze' }}
      AI_PROVIDER_TIMEOUT_MS: ${{ vars.AI_PROVIDER_TIMEOUT_MS || secrets.AI_PROVIDER_TIMEOUT_MS || '25000' }}
      AI_GATEWAY_TIMEOUT_MS: ${{ vars.AI_GATEWAY_TIMEOUT_MS || secrets.AI_GATEWAY_TIMEOUT_MS || '55000' }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://jayguanhai.com/' }}
      APP_PUBLIC_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://jayguanhai.com/' }}
      RELEASE_SHA: ${{ github.sha }}
      AI_REQUESTS_PER_MINUTE: ${{ secrets.AI_REQUESTS_PER_MINUTE }}
      AI_MONTHLY_TOKEN_LIMIT: ${{ secrets.AI_MONTHLY_TOKEN_LIMIT }}
      AI_INPUT_COST_PER_MILLION_USD: ${{ secrets.AI_INPUT_COST_PER_MILLION_USD }}
      AI_OUTPUT_COST_PER_MILLION_USD: ${{ secrets.AI_OUTPUT_COST_PER_MILLION_USD }}
      BILLING_ENABLED: ${{ vars.BILLING_ENABLED || secrets.BILLING_ENABLED || 'false' }}
      BILLING_LIVE_ACCEPTANCE_MODE: ${{ vars.BILLING_LIVE_ACCEPTANCE_MODE || secrets.BILLING_LIVE_ACCEPTANCE_MODE || 'false' }}
      BILLING_ACCEPTANCE_WORKSPACE_ID: ${{ vars.BILLING_ACCEPTANCE_WORKSPACE_ID || secrets.BILLING_ACCEPTANCE_WORKSPACE_ID || '' }}
      BILLING_ACCEPTANCE_RUN_ID: ${{ vars.BILLING_ACCEPTANCE_RUN_ID || secrets.BILLING_ACCEPTANCE_RUN_ID || '' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_WEBHOOK_TOLERANCE_SECONDS: ${{ secrets.STRIPE_WEBHOOK_TOLERANCE_SECONDS }}
      NOTIFICATION_CHANNELS_ENABLED: ${{ vars.NOTIFICATION_CHANNELS_ENABLED || secrets.NOTIFICATION_CHANNELS_ENABLED || 'false' }}
      NOTIFICATION_LIVE_ACCEPTANCE_MODE: ${{ vars.NOTIFICATION_LIVE_ACCEPTANCE_MODE || secrets.NOTIFICATION_LIVE_ACCEPTANCE_MODE || 'false' }}
      NOTIFICATION_ACCEPTANCE_WORKSPACE_ID: ${{ vars.NOTIFICATION_ACCEPTANCE_WORKSPACE_ID || secrets.NOTIFICATION_ACCEPTANCE_WORKSPACE_ID || '' }}
      NOTIFICATION_ACCEPTANCE_RUN_ID: ${{ vars.NOTIFICATION_ACCEPTANCE_RUN_ID || secrets.NOTIFICATION_ACCEPTANCE_RUN_ID || '' }}
      NOTIFICATION_CONFIG_ENCRYPTION_KEY: ${{ secrets.NOTIFICATION_CONFIG_ENCRYPTION_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
      WORKSPACE_INVITE_FROM_EMAIL: ${{ secrets.WORKSPACE_INVITE_FROM_EMAIL }}
      NOTIFICATION_ALERT_MAX_AGE_DAYS: ${{ vars.NOTIFICATION_ALERT_MAX_AGE_DAYS || secrets.NOTIFICATION_ALERT_MAX_AGE_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate required backend release secrets
        shell: bash
        run: |
          set -eu
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY DEEPSEEK_API_KEY DEEPSEEK_MODEL ALLOWED_ORIGINS APP_PUBLIC_URL RESEND_API_KEY WORKSPACE_INVITE_FROM_EMAIL; do
            test -n "${!name:-}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done
          [[ "$APP_PUBLIC_URL" == https://* ]] || { echo "APP_PUBLIC_URL must use https" >&2; exit 1; }
          [[ "$WORKSPACE_INVITE_FROM_EMAIL" == *@* ]] || { echo "WORKSPACE_INVITE_FROM_EMAIL must be a valid Resend sender" >&2; exit 1; }
          [[ "$AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER" == deepseek ]] || { echo "AI live acceptance primary must be deepseek" >&2; exit 1; }
          case "$AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER" in
            coze)
              test -n "${COZE_API_TOKEN:-}${COZE_API_KEY:-}" || { echo "Coze live acceptance requires COZE_API_TOKEN or COZE_API_KEY" >&2; exit 1; }
              test -n "${COZE_BOT_ID_MARKET_QA:-${COZE_BOT_ID:-}}" || { echo "Coze live acceptance requires COZE_BOT_ID_MARKET_QA or COZE_BOT_ID" >&2; exit 1; }
              ;;
            doubao)
              test -n "${DOUBAO_API_KEY:-}${ARK_API_KEY:-}" || { echo "Doubao live acceptance requires DOUBAO_API_KEY or ARK_API_KEY" >&2; exit 1; }
              test -n "${DOUBAO_MODEL:-}${ARK_MODEL:-}" || { echo "Doubao live acceptance requires DOUBAO_MODEL or ARK_MODEL" >&2; exit 1; }
              ;;
            openai)
              test -n "${OPENAI_API_KEY:-}" || { echo "OpenAI live acceptance requires OPENAI_API_KEY" >&2; exit 1; }
              ;;
            *) echo "AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER must be coze, doubao, or openai" >&2; exit 1 ;;
          esac
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Validate formal production origin
        run: python scripts/release_preflight.py --origin-only
      - name: Validate optional production billing configuration
        shell: bash
        run: |
          set -eu
          for flag in BILLING_ENABLED BILLING_LIVE_ACCEPTANCE_MODE; do
            case "${!flag}" in true|false) ;; *) echo "$flag must be true or false" >&2; exit 1 ;; esac
          done
          if [ "$BILLING_ENABLED" = true ] && [ "$BILLING_LIVE_ACCEPTANCE_MODE" = true ]; then
            echo "Disable live acceptance mode before enabling public billing" >&2; exit 1
          fi
          if [ "$BILLING_ENABLED" = true ] || [ "$BILLING_LIVE_ACCEPTANCE_MODE" = true ]; then
            for name in STRIPE_SECRET_KEY STRIPE_PRICE_PRO_MONTHLY STRIPE_WEBHOOK_SECRET; do
              test -n "${!name:-}" || { echo "Stripe live operation requires $name" >&2; exit 1; }
            done
            [[ "$STRIPE_SECRET_KEY" == sk_live_* ]] || { echo "Production billing requires a Stripe live secret key" >&2; exit 1; }
            [[ "$STRIPE_PRICE_PRO_MONTHLY" == price_* ]] || { echo "Invalid Stripe price ID" >&2; exit 1; }
            [[ "$STRIPE_WEBHOOK_SECRET" == whsec_* ]] || { echo "Invalid Stripe webhook signing secret" >&2; exit 1; }
          fi
          if [ "$BILLING_LIVE_ACCEPTANCE_MODE" = true ]; then
            [[ "$BILLING_ACCEPTANCE_WORKSPACE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Live acceptance requires BILLING_ACCEPTANCE_WORKSPACE_ID" >&2; exit 1; }
          fi
          if [ "$BILLING_ENABLED" = true ]; then
            [[ "$BILLING_ACCEPTANCE_RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Public billing requires BILLING_ACCEPTANCE_RUN_ID" >&2; exit 1; }
          fi
      - name: Validate optional external notification configuration
        shell: bash
        run: |
          set -eu
          for flag in NOTIFICATION_CHANNELS_ENABLED NOTIFICATION_LIVE_ACCEPTANCE_MODE; do
            case "${!flag}" in true|false) ;; *) echo "$flag must be true or false" >&2; exit 1 ;; esac
          done
          if [ "$NOTIFICATION_CHANNELS_ENABLED" = true ] && [ "$NOTIFICATION_LIVE_ACCEPTANCE_MODE" = true ]; then
            echo "Disable notification acceptance mode before public notifications" >&2; exit 1
          fi
          case "$NOTIFICATION_CHANNELS_ENABLED:$NOTIFICATION_LIVE_ACCEPTANCE_MODE" in
            true:false|false:true)
              for name in NOTIFICATION_CONFIG_ENCRYPTION_KEY RESEND_API_KEY NOTIFICATION_FROM_EMAIL; do
                test -n "${!name:-}" || { echo "Live notifications require $name" >&2; exit 1; }
              done
              test "${#NOTIFICATION_CONFIG_ENCRYPTION_KEY}" -ge 24 || { echo "NOTIFICATION_CONFIG_ENCRYPTION_KEY must contain at least 24 characters" >&2; exit 1; }
              [[ "$NOTIFICATION_FROM_EMAIL" == *@* ]] || { echo "NOTIFICATION_FROM_EMAIL must be a valid Resend sender" >&2; exit 1; }
              [[ "$NOTIFICATION_ALERT_MAX_AGE_DAYS" =~ ^[0-9]+$ ]] && [ "$NOTIFICATION_ALERT_MAX_AGE_DAYS" -ge 1 ] && [ "$NOTIFICATION_ALERT_MAX_AGE_DAYS" -le 30 ] || { echo "NOTIFICATION_ALERT_MAX_AGE_DAYS must be between 1 and 30" >&2; exit 1; }
              ;;
            false:false) ;;
          esac
          if [ "$NOTIFICATION_LIVE_ACCEPTANCE_MODE" = true ]; then
            [[ "$NOTIFICATION_ACCEPTANCE_WORKSPACE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Acceptance requires NOTIFICATION_ACCEPTANCE_WORKSPACE_ID" >&2; exit 1; }
            [[ "$NOTIFICATION_ACCEPTANCE_RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Acceptance requires NOTIFICATION_ACCEPTANCE_RUN_ID" >&2; exit 1; }
          fi
          if [ "$NOTIFICATION_CHANNELS_ENABLED" = true ]; then
            [[ "$NOTIFICATION_ACCEPTANCE_RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Public notifications require NOTIFICATION_ACCEPTANCE_RUN_ID" >&2; exit 1; }
          fi
          if [ "$NOTIFICATION_CHANNELS_ENABLED" = true ] || [ "$NOTIFICATION_LIVE_ACCEPTANCE_MODE" = true ]; then
            [ "${NOTIFICATION_FROM_EMAIL,,}" != "${WORKSPACE_INVITE_FROM_EMAIL,,}" ] || { echo "Notification and workspace invitation senders must be independent" >&2; exit 1; }
          fi
      - name: Resolve release migration head
        shell: bash
        run: |
          set -eu
          migration_head="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/\.sql$//')"
          test -n "$migration_head"
          echo "MIGRATION_HEAD=$migration_head" >> "$GITHUB_ENV"
      - name: Link Supabase project
        run: npx --yes supabase@2.39.2 link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --dns-resolver https
      - name: Apply database migrations before functions
        run: npx --yes supabase@2.39.2 db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --dns-resolver https
      - name: Verify remote migration head
        shell: bash
        run: |
          set -eu
          migration_version="${MIGRATION_HEAD%%_*}"
          npx --yes supabase@2.39.2 migration list --linked --password "$SUPABASE_DB_PASSWORD" --dns-resolver https | tee migration-list.txt
          awk -v version="$migration_version" '
            $1 == version && $2 == "|" && $3 == version { matched = 1 }
            END { exit matched ? 0 : 1 }
          ' migration-list.txt
      - name: Enforce completed Stripe live acceptance before public billing
        if: env.BILLING_ENABLED == 'true'
        run: python scripts/stripe_live_acceptance.py validate --run-id "$BILLING_ACCEPTANCE_RUN_ID"
      - name: Enforce completed notification live acceptance before public delivery
        if: env.NOTIFICATION_CHANNELS_ENABLED == 'true'
        run: python scripts/notification_live_acceptance.py validate --run-id "$NOTIFICATION_ACCEPTANCE_RUN_ID"
      - name: Configure Edge Function secrets
        shell: bash
        run: |
          set -eu
          args=(
            "DEEPSEEK_API_URL=${DEEPSEEK_API_URL:-https://api.deepseek.com}"
            "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY"
            "DEEPSEEK_MODEL=$DEEPSEEK_MODEL"
            "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_KEY"
            "ACCEPTANCE_HMAC_SECRET=$SUPABASE_SERVICE_KEY"
            "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"
            "RELEASE_SHA=$RELEASE_SHA"
            "RELEASE_MIGRATION_HEAD=$MIGRATION_HEAD"
            "AI_REQUESTS_PER_MINUTE=${AI_REQUESTS_PER_MINUTE:-20}"
            "AI_MONTHLY_TOKEN_LIMIT=${AI_MONTHLY_TOKEN_LIMIT:-0}"
            "AI_INPUT_COST_PER_MILLION_USD=${AI_INPUT_COST_PER_MILLION_USD:-0}"
            "AI_OUTPUT_COST_PER_MILLION_USD=${AI_OUTPUT_COST_PER_MILLION_USD:-0}"
            "AI_FALLBACK_PROVIDERS=${AI_FALLBACK_PROVIDERS:-}"
            "AI_PROVIDER_TIMEOUT_MS=${AI_PROVIDER_TIMEOUT_MS:-25000}"
            "AI_GATEWAY_TIMEOUT_MS=${AI_GATEWAY_TIMEOUT_MS:-55000}"
            "OPENAI_ENABLE_WEB_SEARCH=${OPENAI_ENABLE_WEB_SEARCH:-false}"
            "BILLING_ENABLED=$BILLING_ENABLED"
            "BILLING_LIVE_ACCEPTANCE_MODE=$BILLING_LIVE_ACCEPTANCE_MODE"
            "BILLING_ACCEPTANCE_WORKSPACE_ID=$BILLING_ACCEPTANCE_WORKSPACE_ID"
            "STRIPE_ALLOW_TEST_EVENTS=false"
            "PRODUCTION_SITE_URL=$PRODUCTION_SITE_URL"
            "APP_PUBLIC_URL=$APP_PUBLIC_URL"
            "RESEND_API_KEY=$RESEND_API_KEY"
            "WORKSPACE_INVITE_FROM_EMAIL=$WORKSPACE_INVITE_FROM_EMAIL"
            "NOTIFICATION_CHANNELS_ENABLED=$NOTIFICATION_CHANNELS_ENABLED"
            "NOTIFICATION_LIVE_ACCEPTANCE_MODE=$NOTIFICATION_LIVE_ACCEPTANCE_MODE"
            "NOTIFICATION_ACCEPTANCE_WORKSPACE_ID=$NOTIFICATION_ACCEPTANCE_WORKSPACE_ID"
            "NOTIFICATION_ACCEPTANCE_RUN_ID=$NOTIFICATION_ACCEPTANCE_RUN_ID"
            "NOTIFICATION_ALERT_MAX_AGE_DAYS=$NOTIFICATION_ALERT_MAX_AGE_DAYS"
          )
          for optional_name in COZE_API_URL COZE_API_TOKEN COZE_API_KEY COZE_BOT_ID COZE_BOT_ID_MARKET_QA COZE_BOT_ID_REPORT COZE_BOT_ID_COURSE COZE_MODEL COZE_POLL_INTERVAL_MS COZE_POLL_MAX_ATTEMPTS DOUBAO_API_URL DOUBAO_API_KEY ARK_API_KEY ARK_BASE_URL ARK_MODEL DOUBAO_MODEL OPENAI_API_URL OPENAI_API_KEY OPENAI_MODEL CODEX_API_URL CODEX_API_KEY CODEX_MODEL; do
            if [ -n "${!optional_name:-}" ]; then args+=("$optional_name=${!optional_name}"); fi
          done
          if [ "$BILLING_ENABLED" = true ] || [ "$BILLING_LIVE_ACCEPTANCE_MODE" = true ]; then
            args+=(
              "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
              "STRIPE_PRICE_PRO_MONTHLY=$STRIPE_PRICE_PRO_MONTHLY"
              "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
              "STRIPE_WEBHOOK_TOLERANCE_SECONDS=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}"
            )
          fi
          if [ "$NOTIFICATION_CHANNELS_ENABLED" = true ] || [ "$NOTIFICATION_LIVE_ACCEPTANCE_MODE" = true ]; then
            args+=(
              "NOTIFICATION_CONFIG_ENCRYPTION_KEY=$NOTIFICATION_CONFIG_ENCRYPTION_KEY"
              "NOTIFICATION_FROM_EMAIL=$NOTIFICATION_FROM_EMAIL"
            )
          fi
          npx --yes supabase@2.39.2 secrets set --project-ref "$SUPABASE_PROJECT_ID" "${args[@]}"
      - name: Deploy JWT-protected Edge Functions
        shell: bash
        run: |
          set -eu
          for function_name in ai-proxy history-search resource-library report-save report-export report-docx workspace-invite billing-checkout billing-status billing-portal admin-summary data-subject-request security-gate; do
            npx --yes supabase@2.39.2 functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_ID"
          done
      - name: Verify report function validation contract versions
        shell: bash
        run: |
          set -eu
          expected="$(python - <<'PY'
          import re
          from pathlib import Path
          source = Path('supabase/functions/_shared/report-validation.ts').read_text(encoding='utf-8')
          match = re.search(r"REPORT_VALIDATION_VERSION\s*=\s*'([^']+)'", source)
          if not match:
              raise SystemExit('REPORT_VALIDATION_VERSION missing')
          print(match.group(1))
          PY
          )"
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          stable_rounds=0
          last_summary=""
          for attempt in $(seq 1 72); do
            all_match=true
            summary=""
            for function_name in report-save report-export report-docx; do
              response_file="$probe_dir/$function_name.json"
              if http_status="$(curl --silent --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                -H 'Cache-Control: no-cache' \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
                "$SUPABASE_URL/functions/v1/$function_name?validation_probe=$GITHUB_RUN_ID-$attempt")"; then
                :
              else
                http_status="curl-error"
              fi
              actual="$(python - "$response_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
              print(payload.get('report_validation_version', ''))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              print('')
          PY
              )"
              summary="$summary $function_name=$http_status/${actual:-missing}"
              if [ "$http_status" != "200" ] || [ "$actual" != "$expected" ]; then
                all_match=false
              fi
            done
            last_summary="$summary"
            if [ "$all_match" = true ]; then
              stable_rounds=$((stable_rounds + 1))
            else
              stable_rounds=0
            fi
            echo "Report validation propagation probe $attempt: stable=$stable_rounds/12$summary"
            if [ "$stable_rounds" -ge 12 ]; then break; fi
            sleep 5
          done
          test "$stable_rounds" -ge 12 || { echo "Report function validation contracts did not converge: expected=$expected$last_summary"; exit 1; }
      - name: Deploy Stripe webhook without Supabase JWT verification
        run: npx --yes supabase@2.39.2 functions deploy billing-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Deploy notification dispatcher with application-level authentication
        run: npx --yes supabase@2.39.2 functions deploy notification-dispatch --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

  authenticated-acceptance:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      production_site_url: ${{ steps.release_context.outputs.production_site_url }}
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://jayguanhai.com/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      PROD_TEST_USER_B_EMAIL: ${{ secrets.PROD_TEST_USER_B_EMAIL }}
      PROD_TEST_USER_B_PASSWORD: ${{ secrets.PROD_TEST_USER_B_PASSWORD }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEFER_ACCEPTANCE_CLEANUP: '1'
      PRODUCTION_ACCEPTANCE_OUTPUT: production-acceptance-result.json
      RELEASE_SHA: ${{ github.sha }}
      AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER: ${{ vars.AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER || secrets.AI_LIVE_ACCEPTANCE_PRIMARY_PROVIDER || 'deepseek' }}
      AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER: ${{ vars.AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER || secrets.AI_LIVE_ACCEPTANCE_FALLBACK_PROVIDER || 'coze' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export validated production site URL
        id: release_context
        shell: bash
        run: |
          set -eu
          [[ "$PRODUCTION_SITE_URL" == https://* ]]
          echo "production_site_url=$PRODUCTION_SITE_URL" >> "$GITHUB_OUTPUT"
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Run two-account production report acceptance
        run: python scripts/production_acceptance.py
      - name: Publish backend acceptance result
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-result-${{ github.run_id }}
          path: production-acceptance-result.json
          if-no-files-found: error

  authenticated-acceptance-cleanup:
    if: ${{ always() && needs['authenticated-acceptance'].result != 'success' }}
    needs: authenticated-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ACCEPTANCE_JOB_RESULT: ${{ needs['authenticated-acceptance'].result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Mark and cleanup backend acceptance after failure or timeout
        shell: bash
        run: |
          set -eu
          case "$ACCEPTANCE_JOB_RESULT" in
            cancelled) terminal_status=timed_out ;;
            *) terminal_status=failed ;;
          esac
          python scripts/cleanup_production_acceptance.py --run-id "$ACCEPTANCE_RUN_ID" --mark "$terminal_status"

  build-frontend:
    needs: authenticated-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ needs.authenticated-acceptance.outputs.production_site_url }}
      RELEASE_SHA: ${{ github.sha }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble static site after backend acceptance
        run: python scripts/build_public_site.py --output _site --environment production
      - name: Write release manifest
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          migration_head="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/\.sql$//')"
          test -n "$migration_head"
          production_origin="$(python -c 'from urllib.parse import urlparse; import os; parsed=urlparse(os.environ["PRODUCTION_SITE_URL"]); print(f"{parsed.scheme}://{parsed.netloc}")')"
          python - "$migration_head" "$production_origin" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          Path('_site/release.json').write_text(json.dumps({
              'release_sha': os.environ['GITHUB_SHA'],
              'migration_head': sys.argv[1],
              'production_origin': sys.argv[2],
              'frontend': 'github-pages',
              'source_ref': os.environ.get('GITHUB_REF_NAME', ''),
              'generated_at': datetime.now(timezone.utc).isoformat(),
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-authenticated-acceptance:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://jayguanhai.com/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      PROD_TEST_USER_B_EMAIL: ${{ secrets.PROD_TEST_USER_B_EMAIL }}
      PROD_TEST_USER_B_PASSWORD: ${{ secrets.PROD_TEST_USER_B_PASSWORD }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      RUN_PRODUCTION_ACCEPTANCE: '1'
      PRODUCTION_BROWSER_ACCEPTANCE_OUTPUT: production-browser-acceptance-result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download backend acceptance workspace manifest
        uses: actions/download-artifact@v4
        with:
          name: production-acceptance-result-${{ github.run_id }}
      - name: Select dedicated acceptance workspaces
        shell: bash
        run: |
          set -eu
          test "$(python -c 'import json; print(json.load(open("production-acceptance-result.json"))["acceptance_run_id"])')" = "$ACCEPTANCE_RUN_ID"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          result = json.load(open('production-acceptance-result.json', encoding='utf-8'))
          print('ACCEPTANCE_API_WORKSPACE_ID=' + str(result['api_workspace_id']))
          print('ACCEPTANCE_BROWSER_WORKSPACE_ID=' + str(result['browser_workspace_id']))
          PY
      - name: Resolve ephemeral Supabase service key for cleanup
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Run real browser exception and account-isolation acceptance
        run: JAY_PLAYWRIGHT_BASE_URL="$PRODUCTION_SITE_URL" npm run test:browser:production
      - name: Publish browser exception acceptance result
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-acceptance-result-${{ github.run_id }}
          path: production-browser-acceptance-result.json
          if-no-files-found: error
      - name: Summarize browser acceptance diagnostics without contents
        if: failure()
        run: python scripts/summarize_test_diagnostics.py --input test-results --output browser-acceptance-diagnostics.json
      - name: Upload content-free browser diagnostic summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-diagnostics-${{ github.run_id }}
          path: browser-acceptance-diagnostics.json
          if-no-files-found: error
          retention-days: 7
  browser-authenticated-acceptance-cleanup:
    if: ${{ always() }}
    needs: browser-authenticated-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      ACCEPTANCE_JOB_RESULT: ${{ needs.browser-authenticated-acceptance.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Mark and cleanup browser acceptance after termination
        shell: bash
        run: |
          set -eu
          case "$ACCEPTANCE_JOB_RESULT" in
            success) terminal_status=passed ;;
            cancelled) terminal_status=timed_out ;;
            *) terminal_status=failed ;;
          esac
          python scripts/cleanup_production_acceptance.py --run-id "$ACCEPTANCE_RUN_ID" --mark "$terminal_status"

  production-smoke:
    if: ${{ always() && needs['browser-authenticated-acceptance'].result == 'success' && needs['browser-authenticated-acceptance-cleanup'].result == 'success' }}
    needs:
      - browser-authenticated-acceptance
      - browser-authenticated-acceptance-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL || secrets.PRODUCTION_SITE_URL || 'https://jayguanhai.com/' }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PROD_TEST_USER_A_EMAIL: ${{ secrets.PROD_TEST_USER_A_EMAIL }}
      PROD_TEST_USER_A_PASSWORD: ${{ secrets.PROD_TEST_USER_A_PASSWORD }}
      EXPECTED_RELEASE_SHA: ${{ github.sha }}
      ACCEPTANCE_RESULT_FILE: production-acceptance-result.json
      BROWSER_ACCEPTANCE_RESULT_FILE: production-browser-acceptance-result.json
      NOTIFICATION_CHANNELS_ENABLED: ${{ vars.NOTIFICATION_CHANNELS_ENABLED || secrets.NOTIFICATION_CHANNELS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download backend acceptance result
        uses: actions/download-artifact@v4
        with:
          name: production-acceptance-result-${{ github.run_id }}
      - name: Download browser exception acceptance result
        uses: actions/download-artifact@v4
        with:
          name: production-browser-acceptance-result-${{ github.run_id }}
      - name: Resolve expected migration head
        shell: bash
        run: |
          set -eu
          migration_head="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1 | sed 's/\.sql$//')"
          test -n "$migration_head"
          echo "EXPECTED_MIGRATION_HEAD=$migration_head" >> "$GITHUB_ENV"
      - name: Verify deployed frontend, database, Storage and functions
        shell: bash
        run: python scripts/production_release_check.py
