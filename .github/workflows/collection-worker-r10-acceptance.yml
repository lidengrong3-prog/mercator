name: Collection Worker R10 Acceptance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      require_passed:
        description: Fail unless the full 24-hour gate has passed
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mercator-collection-worker-r10-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      COLLECTION_WORKER_ID: ${{ vars.COLLECTION_WORKER_ID || 'mercator-render-primary' }}
      COLLECTION_WORKER_MAX_HEARTBEAT_GAP_SECONDS: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic R10 failure scenarios
        run: |
          python -m unittest discover -s tests -p "test_collection_worker.py" -v
          node --test tests/collection-worker.test.cjs
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Evaluate shared-state and 24-hour production evidence
        shell: bash
        env:
          REQUIRE_PASSED: ${{ inputs.require_passed || 'false' }}
        run: |
          set -eu
          args=(--window-hours 25 --required-hours 24 --output collection-worker-r10-acceptance.json)
          if [ "$REQUIRE_PASSED" = true ]; then args+=(--require-passed); fi
          python scripts/collection_worker_r10_acceptance.py "${args[@]}"
      - name: Publish sanitized R10 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-worker-r10-acceptance-${{ github.run_id }}
          path: collection-worker-r10-acceptance.json
          if-no-files-found: warn
          retention-days: 90
