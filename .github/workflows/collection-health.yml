name: Collection Worker Health

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      COLLECTION_WORKER_POLL_SECONDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Inspect queue, leases, circuits and TikHub budget
        run: python scripts/collection_worker.py --health-check > collection-worker-health.json
      - name: Capture 24-hour Worker continuity and idempotency evidence
        run: python scripts/collection_worker.py --runtime-evidence --window-hours 24 > collection-worker-runtime-evidence.json
      - name: Publish worker health summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-worker-health-${{ github.run_id }}
          path: |
            collection-worker-health.json
            collection-worker-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30
