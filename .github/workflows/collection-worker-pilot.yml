name: Collection Worker Pilot Cutover

on:
  workflow_dispatch:
    inputs:
      collector:
        description: Single allowlisted collector for the pilot batch
        type: choice
        required: true
        default: collect_cpsc
        options:
          - collect_cpsc
          - collect_data
          - collect_us_taxes
          - collect_us_access
          - collect_us_market
          - collect_us_macro
          - backfill_history
          - tikhub_pilot
          - tikhub_content
      parameters_json:
        description: Optional parameters for the selected collector, as a JSON object
        required: false
        default: '{}'
        type: string
      run_id:
        description: Optional idempotency ID; leave empty to use this workflow run
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mercator-collection-worker-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ format('https://{0}.supabase.co', secrets.SUPABASE_PROJECT_ID) }}
      COLLECTION_WORKER_CUTOVER: ${{ vars.COLLECTION_WORKER_CUTOVER || 'false' }}
      PILOT_COLLECTOR: ${{ inputs.collector }}
      PILOT_PARAMETERS_JSON: ${{ inputs.parameters_json }}
      PILOT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve ephemeral Supabase service key
        shell: bash
        run: |
          set -eu
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_ACCESS_TOKEN"
          keys_json="$(npx --yes supabase@2.39.2 projects api-keys --project-ref "$SUPABASE_PROJECT_ID" --output json)"
          service_key="$(printf '%s' "$keys_json" | python scripts/resolve_supabase_service_key.py)"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          echo "SUPABASE_SERVICE_KEY=$service_key" >> "$GITHUB_ENV"
      - name: Refuse pilot unless queue cutover is explicitly enabled
        shell: bash
        run: |
          set -eu
          test "$(printf '%s' "$COLLECTION_WORKER_CUTOVER" | tr '[:upper:]' '[:lower:]')" = "true"
      - name: Enqueue one source and verify collection, quality gate, sync and publication
        shell: bash
        run: |
          set -eu
          run_id="${PILOT_RUN_ID:-pilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          parameters="${PILOT_PARAMETERS_JSON:-}"
          if [ -z "$parameters" ]; then parameters='{}'; fi
          python scripts/collection_worker_pilot.py \
            --collector "$PILOT_COLLECTOR" \
            --parameters-json "$parameters" \
            --run-id "$run_id" \
            --output collection-worker-pilot-result.json
      - name: Publish pilot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collection-worker-pilot-${{ github.run_id }}
          path: collection-worker-pilot-result.json
          if-no-files-found: warn
          retention-days: 30
