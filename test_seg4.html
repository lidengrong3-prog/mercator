<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Seg4 Test (chars 26919-35967)</title>
<style>
:root{
  --primary:#2d5a8e;--primary-light:#3a6fa8;--primary-dark:#1a3a6b;
  --bg:#f0f2f5;--card:#ffffff;--text:#1f2a37;--text-secondary:#6b7280;
  --border:#e5e7eb;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:12px;
  --red:#ef4444;--orange:#f59e0b;--green:#10b981;
  --amazon:#ff9900;--aliexpress:#e43225;--tiktok:#010101;--ebay:#0064d2;--shopee:#ee4d2d;
  --ink:#1f2a37;--muted:#6b7280;--paper:#f0f2f5;--line:#e5e7eb;
  --sea:#2d5a8e;--sea-deep:#1a3a6b;--sea-soft:#eef2ff;--wave:#dbeafe;
  --sage:#eef2ff;--orange-accent:#2d5a8e;--orange-light:#eef2ff;
}

.ov-hero-result .ovr-card{background:#fff;border:1px solid #d4e4f7;border-radius:14px;padding:18px 20px;box-shadow:0 6px 24px rgba(59,125,216,.08)}
.ov-hero-result .ovr-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ov-hero-result .ovr-head span{font-size:22px}
.ov-hero-result .ovr-head h4{margin:0;font-size:15px;color:#1a2332}
.ov-hero-result .ovr-head h4 small{font-size:11px;color:#7a9088;font-weight:500;margin-left:8px}
.ov-hero-result .ovr-loading{display:flex;align-items:center;gap:10px;color:#5a706a;font-size:13px;padding:6px 0}
.ov-hero-result .ovr-loading i{display:inline-block;width:16px;height:16px;border:2px solid #d4e4f7;border-top-color:var(--primary);border-radius:50%;animation:ovrSpin 1s linear infinite}
@keyframes ovrSpin{to{transform:rotate(360deg)}}
.ov-hero-result .ovr-steps{display:flex;flex-direction:column;gap:9px;margin:8px 0 12px}
.ov-hero-result .ovr-step{display:flex;align-items:center;gap:12px;opacity:.4;transition:.3s}
.ov-hero-result .ovr-step.active{opacity:1}
.ov-hero-result .ovr-step.done{opacity:.9}
.ov-hero-result .ovr-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px serif;background:#eaf5fe;color:var(--primary);border:1px solid #cfe8fb;flex:0 0 auto;transition:.3s}
.ov-hero-result .ovr-step.active .ovr-dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(59,125,216,.18)}
.ov-hero-result .ovr-step.done .ovr-dot{background:#2c9d6b;color:#fff;border-color:#2c9d6b}
.ov-hero-result .ovr-step b{font-size:13px;color:#1a2332;display:block;line-height:1.3}
.ov-hero-result .ovr-step small{font-size:11px;color:#7a9088}
.ov-hero-result .ovr-progress-bar{height:5px;background:#eaf5fe;border-radius:6px;overflow:hidden;margin-top:2px}
.ov-hero-result .ovr-progress-bar i{display:block;height:100%;width:33%;background:linear-gradient(90deg,#3b7dd8,#1e5fae);border-radius:6px;transition:width .45s ease}
.ov-hero-result .ovr-section{margin-top:12px}
.ov-hero-result .ovr-section:first-of-type{margin-top:0}
.ov-hero-result .ovr-section h5{margin:0 0 8px;font-size:12px;color:var(--primary);font-weight:700;display:flex;align-items:center;gap:6px}
.ov-hero-result .ovr-section p{margin:0 0 6px;font-size:13px;color:#3c4a43;line-height:1.6}
.ov-hero-result .ovr-section ul{margin:0;padding-left:18px;font-size:13px;color:#3c4a43;line-height:1.7}
.ov-hero-result .ovr-section li{margin-bottom:4px}
.ov-hero-result .ovr-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ov-hero-result .ovr-tag{background:#f0f7ff;color:var(--primary);border:1px solid #d4e4f7;border-radius:12px;padding:3px 10px;font-size:11px}
.ov-hero-result .ovr-foot{display:flex;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid #eef3f8}
.ov-hero-result .ovr-foot button{border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.ov-hero-result .ovr-foot button:hover{background:var(--primary);color:#fff}
.ov-hero-result .ovr-foot button.primary{background:var(--primary);color:#fff}
.ov-hero-result .ovr-note{font-size:11px;color:#9aa29e;margin-top:10px;line-height:1.5}
.ov-hero-result .ovr-empty{text-align:center;padding:12px 0;color:#7a9088;font-size:13px}

/* OV 2-col layout */
.ov-2col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
.ov-panel{background:#fff;border:1px solid #e2ecf7;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ov-panel-head{padding:16px 20px 12px;border-bottom:1px solid #f0f4f9;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ov-panel-head h2{margin:0;font-size:16px;font-weight:700;color:var(--text);flex:0 0 auto}
.ov-panel-tabs{display:flex;gap:4px}
.ov-tab{padding:4px 11px;font-size:12px;color:var(--text-secondary);cursor:pointer;border-radius:14px;transition:.2s}
.ov-tab:hover{background:#f0f7ff;color:var(--primary)}
.ov-tab.active{background:linear-gradient(135deg,#2d5a8e,#3a7cc0);color:#fff}
.ov-panel-head .filter-button{margin-left:auto;font-size:12px;padding:5px 12px;background:var(--primary);color:#fff;border-radius:8px}
.ov-notice-list{list-style:none;margin:0;padding:6px 0;max-height:520px;overflow-y:auto}
.ov-notice-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.ov-notice-item:hover{background:#f5f9ff;border-left-color:var(--primary)}
.ov-notice-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ov-notice-title{flex:1;font-size:13.5px;color:#2c3e50;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-notice-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.04)}
.ov-notice-date{font-size:12px;color:#95a5a6;flex-shrink:0}
.ov-panel-foot{padding:10px 20px;border-top:1px solid #f0f4f9;font-size:11.5px}
.ov-data-note{color:#b7950b}
.ov-service-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:12px}
.ov-service-card{background:linear-gradient(135deg,#f5f9ff 0%,#ffffff 100%);border:1px solid #e2ecf7;border-radius:10px;padding:13px 14px;cursor:pointer;transition:.2s}
.ov-service-card:hover{background:#fff;border-color:var(--primary);box-shadow:0 6px 18px rgba(45,90,142,.15);transform:translateY(-2px)}
.ov-service-title{font-size:13.5px;font-weight:700;color:var(--primary-dark);margin-bottom:5px}
.ov-service-desc{font-size:11.5px;color:var(--text-secondary);line-height:1.55}

/* OV Insights Dark */
.ov-insights-dark{background:linear-gradient(135deg,#1a3a6b 0%,#2c4a60 50%,#1e3f5a 100%);border-radius:12px;padding:26px 28px;margin-bottom:22px;color:#fff}
.ov-insights-head{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.ov-insights-head span{font-size:14px;color:#6aadff}
.ov-insights-head h3{font-size:16px;margin:0;color:#fff}
.ov-insight-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ov-insight-tab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#c7d6e6;padding:6px 16px;border-radius:20px;font-size:12px;cursor:pointer;transition:.2s}
.ov-insight-tab:hover{background:rgba(255,255,255,.16);color:#fff}
.ov-insight-tab.active{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.ov-insights-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ov-insight-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:16px;transition:all .2s}
.ov-insight-card:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.ov-insight-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:8px}
.ov-insight-body{font-size:12px;color:#b3c6d6;line-height:1.6;margin-bottom:12px}
.ov-insight-pill{display:inline-block;font-size:10px;background:var(--primary);color:#fff;padding:3px 10px;border-radius:4px}
.ov-insight-pill.warning{background:#c39142}

/* Wave divider */
.wave-divider{margin:12px 0;opacity:.4}

/* User dropdown */
#user-dropdown{position:absolute;bottom:70px;left:9px;right:9px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 0;z-index:10;box-shadow:0 -4px 16px rgba(0,0,0,.1);display:none}

/* Workspace area */
.workspace{display:flex;align-items:center;gap:9px}
.workspace>span:last-child{margin-left:auto}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:white;font-size:12px}

/* Tabbar */
.tabbar{border-bottom:1px solid var(--line);margin-bottom:20px}
.tabbar button{background:none;border:0;padding:12px 18px 13px 0;margin-right:20px;font-family:inherit;color:var(--muted);cursor:pointer}
.tabbar .selected{color:var(--ink);border-bottom:2px solid var(--primary);font-weight:600}

/* Filter row */
.filter-row{display:flex;gap:10px;margin-bottom:18px}
.filter-button{background:var(--primary);color:#fff;padding:0 16px;border-radius:8px}
.filter-button:hover{background:var(--primary-dark)}

/* Country grid */
.country-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.country-card{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;cursor:pointer;transition:.15s}
.country-card:hover{transform:translateY(-2px);border-color:#a8b8d0}

/* Responsive */
@media(max-width:1200px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .topnav-center{display:none}
}
@media(max-width:1000px){
  .country-grid,.grid-3,.platform-grid,.watch-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.ov-2col{grid-template-columns:1fr}
  .ov-insights-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  aside.sidebar{width:58px;padding:8px}
  .brand{padding:12px 4px}
  .brand strong,.brand small,.nav-item:not(.active)::after,.sidebar-bottom .user-info{display:none}
  .nav-item{justify-content:center;padding:13px 0;font-size:0}
  .nav-item span{font-size:17px}
  .nav-item b{display:none}
  .main-content>header{padding:12px 16px}
  .page{padding:0 16px 16px}
  .country-grid,.grid-3,.grid-4,.platform-grid{grid-template-columns:1fr}
}


</style></head>
<body style="background:#f0f2f5;padding:30px;">
<h1 style="color: var(--primary);">Seg4 - chars 26919-35967</h1>
<div style="background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin: 20px 0;">
  <p style="color: var(--text);">卡片内容</p>
  <p style="color: var(--text-secondary);">辅助文字</p>
</div>
<div class="chat-msg bot" style="margin:10px 0;">聊天消息</div>
<p style="color: var(--primary); font-size:20px; font-weight:bold;">这段应该是蓝色 → 如果黑色说明此段有错</p>
</body></html>
