<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Seg1 Test (chars 0-8971)</title>
<style>
:root{
  --primary:#2d5a8e;--primary-light:#3a6fa8;--primary-dark:#1a3a6b;
  --bg:#f0f2f5;--card:#ffffff;--text:#1f2a37;--text-secondary:#6b7280;
  --border:#e5e7eb;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:12px;
  --red:#ef4444;--orange:#f59e0b;--green:#10b981;
  --amazon:#ff9900;--aliexpress:#e43225;--tiktok:#010101;--ebay:#0064d2;--shopee:#ee4d2d;
  --ink:#1f2a37;--muted:#6b7280;--paper:#f0f2f5;--line:#e5e7eb;
  --sea:#2d5a8e;--sea-deep:#1a3a6b;--sea-soft:#eef2ff;--wave:#dbeafe;
  --sage:#eef2ff;--orange-accent:#2d5a8e;--orange-light:#eef2ff;
}


/* ==========================================
   JAY观海 - Redesigned UI
   Based on EchoTik/FastMoss business style
   ========================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#2d5a8e;--primary-light:#3a6fa8;--primary-dark:#1a3a6b;
  --bg:#f0f2f5;--card:#ffffff;--text:#1f2a37;--text-secondary:#6b7280;
  --border:#e5e7eb;--shadow:0 2px 8px rgba(0,0,0,0.08);--radius:12px;
  --red:#ef4444;--orange:#f59e0b;--green:#10b981;
  --amazon:#ff9900;--aliexpress:#e43225;--tiktok:#010101;--ebay:#0064d2;--shopee:#ee4d2d;
  --ink:#1f2a37;--muted:#6b7280;--paper:#f0f2f5;--line:#e5e7eb;
  --sea:#2d5a8e;--sea-deep:#1a3a6b;--sea-soft:#eef2ff;--wave:#dbeafe;
  --sage:#eef2ff;--orange-accent:#2d5a8e;--orange-light:#eef2ff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;font-size:14px}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;font-family:inherit}
input,select{font-family:inherit}
h1,h2{margin:0;font-weight:600}
h1{font-size:24px;letter-spacing:-.3px}
h2{font-size:18px}

/* === LOGIN PAGE === */
.login-screen{position:fixed;inset:0;z-index:20;background:linear-gradient(135deg,#1a3a6b 0%,#2d5a8e 50%,#3a7cc0 100%);display:flex;align-items:center;justify-content:center;gap:80px;color:#fff}
.login-brand{width:300px}
.login-brand .brand-mark{width:60px;height:60px;display:grid;place-items:center;font:800 36px -apple-system,sans-serif;color:#fff;background:#fff;border-radius:14px;color:var(--primary);margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.login-brand strong{font-size:36px;font-weight:700;display:block;letter-spacing:1px}
.login-brand small,.workspace small{display:block;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.6);margin-top:4px}
.login-card{background:#fff;color:var(--text);width:400px;padding:36px;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.2)}
.login-card h1{font-size:24px;line-height:1.3;margin-bottom:8px}
.login-card>p{font-size:13px;color:var(--text-secondary);margin:8px 0 20px;line-height:1.7}
.login-card label{display:grid;gap:6px;font-size:12px;margin:14px 0;font-weight:500}
.login-card input{border:1px solid var(--border);border-radius:8px;padding:11px 14px;font-size:14px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,90,142,.1)}
.login-button{width:100%;border:0;background:linear-gradient(135deg,#2d5a8e,#3a7cc0);color:white;padding:13px;margin-top:12px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(45,90,142,.3)}
.login-button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(45,90,142,.4)}
.eyebrow{font-size:11px;letter-spacing:1px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;font-weight:600}
.auth-tabs{display:flex;gap:0;margin:16px 0;border-bottom:1px solid var(--border)}
.auth-tabs button{flex:1;padding:10px;background:none;border:none;border-bottom:2px solid transparent;font-size:14px;color:var(--muted);cursor:pointer;transition:.2s;font-weight:500}
.auth-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.auth-field{margin-bottom:12px}
.auth-field label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.auth-field input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;outline:none;transition:border .2s}
.auth-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,90,142,.1)}
.auth-error{color:var(--red);font-size:12px;min-height:20px;margin:8px 0}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#ccc;font-size:12px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* === APP LAYOUT === */
.app-layout{display:none;height:100vh;width:100%;flex-direction:column}
.app-layout.active{display:flex}

/* Top Navbar */
.topnav{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;flex-shrink:0;z-index:100}
.topnav-left{display:flex;align-items:center;gap:10px;min-width:200px}
.topnav-left .logo{width:34px;height:34px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0}
.topnav-left .brand-name{font-size:17px;font-weight:700;color:var(--text);white-space:nowrap}
.topnav-left .demo-tag{font-size:10px;background:#eef2ff;color:var(--primary);padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:1px}
.topnav-center{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
.topnav-center a,.topnav-center .nav-btn{padding:8px 16px;font-size:14px;color:var(--text-secondary);border-radius:8px;transition:all .2s;font-weight:500;white-space:nowrap;cursor:pointer}
.topnav-center a:hover,.topnav-center .nav-btn:hover{color:var(--text);background:#f3f4f6}
.topnav-center .nav-btn.active{color:#fff;background:var(--primary);font-weight:600}
.topnav-right{display:flex;align-items:center;gap:10px;min-width:260px;justify-content:flex-end}
.topnav-right .search-box{display:flex;align-items:center;background:var(--bg);border-radius:8px;padding:6px 12px;gap:6px;width:180px}
.topnav-right .search-box input{background:none;border:none;outline:none;font-size:13px;width:100%;color:var(--text)}
.topnav-right .icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .2s;position:relative;font-size:18px;cursor:pointer;border:none;background:none}
.topnav-right .icon-btn:hover{background:var(--bg)}
.topnav-right .badge{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--red);color:#fff;font-size:10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600}
.topnav-right .lang{font-size:13px;color:var(--text-secondary);padding:4px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:#fff}
.topnav-right .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;cursor:pointer}

/* Content Area */
.content-wrap{display:flex;flex:1;overflow:hidden}

/* Sidebar */
aside.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;flex-shrink:0;z-index:2;overflow-y:auto}
.sidebar .side-search{margin:16px 16px 12px;padding:8px 12px;background:var(--bg);border-radius:8px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-secondary);cursor:pointer;transition:background .2s}
.sidebar .side-search:hover{background:#e8eaed}
.sidebar-menu{flex:1;padding:0 8px}
.sidebar-item,.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--text-secondary);cursor:pointer;transition:all .2s;margin-bottom:2px;font-weight:500;position:relative;text-decoration:none;border:none;background:none;width:100%;text-align:left}
.sidebar-item:hover,.nav-item:hover{background:#f3f4f6;color:var(--text)}
.sidebar-item.active,.nav-item.active{background:#eef2ff;color:var(--primary);font-weight:600}
.sidebar-item .icon,.nav-item span{font-size:20px;width:24px;text-align:center;flex-shrink:0}
.sidebar-item .count-badge,.nav-item b.danger{background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;position:absolute;right:12px;font-weight:600}
.sidebar-bottom{padding:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;margin:0 8px}
.sidebar-bottom .user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;flex-shrink:0}
.sidebar-bottom .user-info{font-size:13px}
.sidebar-bottom .user-name{font-weight:600;color:var(--text)}
.sidebar-bottom .user-plan{font-size:11px;color:var(--text-secondary)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 16px 16px;margin:0}
.brand-mark{width:36px;height:36px;display:grid;place-items:center;font:800 22px -apple-system,sans-serif;color:#fff;background:var(--primary);border-radius:8px;line-height:1}
.brand strong{font-size:18px;font-weight:700;letter-spacing:.3px;line-height:1.3}
.brand small{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-top:2px}
.nav-group-label{font-size:10px;font-weight:600;letter-spacing:1px;color:#aaa;text-transform:uppercase;padding:16px 12px 6px}
nav{display:grid;gap:2px;padding:0 8px;overflow-y:auto}

/* Main Content */
.main-content{flex:1;overflow-y:auto;background:var(--bg)}
</style></head>
<body style="background:#f0f2f5;padding:30px;">
<h1 style="color: var(--primary);">Seg1 - chars 0-8971</h1>
<div style="background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin: 20px 0;">
  <p style="color: var(--text);">卡片内容</p>
  <p style="color: var(--text-secondary);">辅助文字</p>
</div>
<div class="chat-msg bot" style="margin:10px 0;">聊天消息</div>
<p style="color: var(--primary); font-size:20px; font-weight:bold;">这段应该是蓝色 → 如果黑色说明此段有错</p>
</body></html>
